        async src="//gc.zgo.at/count.js"></script>

<!-- View counter (Shadow Worker) -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var API = "https://blog-view-counter.wellbird7.workers.dev";

  document.querySelectorAll(".page-views").forEach(function (el) {
    var path = el.dataset.path || "/";
    fetch(API + "/public/page?path=" + encodeURIComponent(path))
      .then(function (r) { return r.json(); })
      .then(function (d) { el.querySelector(".view-count").textContent = (d && d.count) || "0"; })
      .catch(function () { el.querySelector(".view-count").textContent = "0"; });
  });

  var totalEl = document.getElementById("total-visitors");
  if (totalEl) {
    fetch(API + "/public/site")
      .then(function (r) { return r.json(); })
      .then(function (d) { totalEl.textContent = (d && d.count) || "0"; })
      .catch(function () { totalEl.textContent = "0"; });
  }
});
</script>
